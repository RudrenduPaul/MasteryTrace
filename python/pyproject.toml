[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masterytrace-cli"
version = "0.1.5"
description = "Mastery Measurement API and CLI: fits Bayesian Knowledge Tracing (BKT) and Item Response Theory (2PL IRT) models to learner response logs and reports per-learner, per-skill mastery estimates."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Rudrendu Paul" },
  { name = "Sourav Nandy" },
]
keywords = ["bkt", "irt", "bayesian-knowledge-tracing", "item-response-theory", "education", "edtech", "learning-analytics", "psychometrics", "cli", "agent-native", "python", "adaptive-learning", "mastery-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9",
  "build>=1.0,<2",
  "twine>=5.0,<7",
]
mcp = ["mcp[cli]>=2.0.0"]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/MasteryTrace"
Repository = "https://github.com/RudrenduPaul/MasteryTrace"
"Bug Tracker" = "https://github.com/RudrenduPaul/MasteryTrace/issues"
Changelog = "https://github.com/RudrenduPaul/MasteryTrace/blob/main/CHANGELOG.md"
Documentation = "https://github.com/RudrenduPaul/MasteryTrace/blob/main/docs/getting-started.md"
"Author - Rudrendu Paul" = "https://github.com/RudrenduPaul"
"Author - Sourav Nandy" = "https://github.com/Sourav-nandy-ai"

[project.scripts]
masterytrace = "masterytrace.cli.index:main"
masterytrace-mcp = "masterytrace.mcp_server:main"

[tool.hatch.build]
exclude = [".venv*/"]

[tool.hatch.build.targets.wheel]
packages = ["src/masterytrace"]

[tool.hatch.build.targets.sdist]
include = [
  "src/masterytrace",
  "tests",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
